services:
  - type: web
    name: otsile-trading
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: BROKER_MODE
        value: paper
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: DATABASE_PATH
        value: /opt/render/project/src/otsile_trading.db
